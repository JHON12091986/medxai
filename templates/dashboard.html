<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="30">
    <title>NINA Status Dashboard</title>
    <style>
        body {
            background-color: #1a1a2e;
            color: #00ff88;
            font-family: monospace;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
            font-size: 16px;
        }
        h1, h2 {
            border-bottom: 1px solid #00ff88;
            padding-bottom: 5px;
        }
        .section {
            margin-bottom: 20px;
            background-color: rgba(0, 255, 136, 0.05);
            padding: 15px;
            border-radius: 5px;
            border: 1px solid #00ff88;
        }
        pre {
            white-space: pre-wrap;
            word-wrap: break-word;
            margin: 0;
            font-family: inherit;
        }
    </style>
</head>
<body>
    <h1>NINA Status Dashboard</h1>
    <p>Last loaded: {{ page_load_time }}</p>

    <div class="section">
        <h2>🟢 Service</h2>
        <pre>{{ service_status }}</pre>
    </div>

    <div class="section">
        <h2>📡 Providers</h2>
        <pre>{{ provider_health }}</pre>
    </div>

    <div class="section">
        <h2>📋 Tasks</h2>
        <pre>{{ tasks_summary }}</pre>
    </div>

    <div class="section">
        <h2>⏰ Crons</h2>
        <pre>{{ cron_metrics }}</pre>
    </div>

    <div class="section">
        <h2>🕐 Last Sync</h2>
        <pre>{{ last_sync_time }}</pre>
    </div>
</body>
</html>
