name: Validate Index

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - run: python3 tools/validate_index.py --check-deltas
