name: Governance Index Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 0' # Run weekly on Sunday

jobs:
  validate-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11' # Matches the script requirements
      - name: Validate Index
        run: |
          python3 tools/validate_index.py --check-deltas
      - name: Audit Repository Hygiene
        run: |
          chmod +x scripts/nina_audit.sh
          ./scripts/nina_audit.sh --strict
